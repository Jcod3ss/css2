<!DOCTYPE html>
<html lang="en-US">
  <head>
    <!-- your metadata goes here in the "head" -->
    <title>CSS tut</title>
    <meta name="author" content="Joseph Vasquez">
    <meta name="description" content="Css Link tree?">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      /* your CSS code goes here in the "style" */

      body {
        font-family: Helvetica, Arial, sans-serif;
        line-height: 1.5;
        color: #111111;
      }

      a {
        color: #b94bac;
      }

      nav {
        display: flex;
        justify-content: space-around;
        flex-direction: column;
        align-items: center;
      }

      nav > a {
        text-decoration: none;
        text-align: center;
        width: 160px;
        margin: 10px;
        border: 3px solid #b94bac;
        border-radius: 10px;
        padding: 3px 14px;
      }

      a:hover;
       text-decoration: none;
      {}

      nav > a:hover {
        background: #b94bac;
        color: blue;
      }

      .wrap {
        max-width: 650px;
        margin: auto;
      }
    </style>

  </head>
  <body>
    <!-- you page's content goes here in the "body" -->
    <div class="wrap">
      <h1>Hellooo</h1>

      <p>
        Welcome to my page!take a look at a new coders, code im just following the template and learning.
    </div>

    <nav>
      <a href="https://en.wikipedia.org/wiki/World_Wide_Web">working on this</a>
      <a href="https://en.wikipedia.org/wiki/Internet">really into this</a>
      <a href="https://en.wikipedia.org/wiki/Project_Xanadu">project xanadu</a>
      <a href="https://en.wikipedia.org/wiki/Memex">the memex</a>
    </nav>
  </body>
</html>
